<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Demo</title>
    <style>
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
        #canvas { display: block; width: 100%; height: 100%; touch-action: none; }
        #progress { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: min(80vw, 480px); color: #fff; font: 16px sans-serif; text-align: center; }
        #progress-box { border: 2px solid #fff; padding: 4px; margin-top: 16px; }
        #progress-bar { height: 20px; width: 0%; background: #fff; }
    </style>
</head>
<body oncontextmenu="return false" onload="main()">
    <div id="progress" role="status">Loading Demo…
        <div id="progress-box"><div id="progress-bar"></div></div>
    </div>
    <canvas id="canvas" tabindex="0" aria-label="Demo"></canvas>
    <noscript>Enable JavaScript to run the demo.</noscript>
    <script src="teavm/app.js"></script>
</body>
</html>
