apply plugin: "com.android.application"

def releaseSigningProps = new Properties()
def releaseSigningPropsFile = rootProject.file("android/key.properties")
if (releaseSigningPropsFile.exists()) {
    releaseSigningPropsFile.withInputStream { stream ->
        releaseSigningProps.load(stream)
    }
}

def releaseStoreFile = releaseSigningProps.getProperty("storeFile") ?: System.getenv("ANDROID_KEYSTORE_FILE")
def releaseStorePassword = releaseSigningProps.getProperty("storePassword") ?: System.getenv("ANDROID_KEYSTORE_PASSWORD")
def releaseKeyAlias = releaseSigningProps.getProperty("keyAlias") ?: System.getenv("ANDROID_KEY_ALIAS")
def releaseKeyPassword = releaseSigningProps.getProperty("keyPassword") ?: System.getenv("ANDROID_KEY_PASSWORD")
def useAliyunMirror = ((rootProject.findProperty('useAliyunMirror') ?: System.getenv('USE_ALIYUN_MIRROR') ?: 'false') as String).toBoolean()

def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace "com.joker.puzzle"
    compileSdk 36
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            aidl.srcDirs = ['src']
            renderscript.srcDirs = ['src']
            res.srcDirs = ['res']
            jniLibs.srcDirs = ['libs']
            assets.srcDirs = ['../assets']
        }
    }
    defaultConfig {
        applicationId "com.joker.puzzle"
        minSdkVersion 23
        targetSdkVersion 36
        versionCode 23
        versionName "1.4.9"
        multiDexEnabled true
        ndk{
            abiFilters "armeabi-v7a","arm64-v8a"
        }

    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            // 显示Log
            minifyEnabled false //开启混淆
            shrinkResources false //删除无用资源
            proguardFile getDefaultProguardFile('proguard-android.txt')
            proguardFile 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    packagingOptions {
        exclude 'META-INF/*.kotlin_module'
    }

}

task run(type: Exec) {
    def path
    def localProperties = project.file("../local.properties")
    if (localProperties.exists()) {
        Properties properties = new Properties()
        localProperties.withInputStream { instr ->
            properties.load(instr)
        }
        def sdkDir = properties.getProperty('sdk.dir')
        if (sdkDir) {
            path = sdkDir
        } else {
            path = "$System.env.ANDROID_HOME"
        }
    } else {
        path = "$System.env.ANDROID_HOME"
    }

    def adb = path + "/platform-tools/adb"
    commandLine "$adb", 'shell', 'am', 'start', '-n', 'com.tony.puzzle/com.tony.puzzle.AndroidLauncher'
}

task runKeyboardDemo(type: Exec) {
    def path
    def localProperties = project.file("../local.properties")
    if (localProperties.exists()) {
        Properties properties = new Properties()
        localProperties.withInputStream { instr ->
            properties.load(instr)
        }
        def sdkDir = properties.getProperty('sdk.dir')
        if (sdkDir) {
            path = sdkDir
        } else {
            path = "$System.env.ANDROID_HOME"
        }
    } else {
        path = "$System.env.ANDROID_HOME"
    }

    def adb = path + "/platform-tools/adb"
    commandLine "$adb", 'shell', 'am', 'start', '-n', 'com.tony.puzzle/com.joker.puzzle.demo.KeyboardHeightCaseDemoActivity'
}

repositories{
    mavenLocal()
    google()
    mavenCentral()

    if (useAliyunMirror) {
        maven { url 'https://maven.aliyun.com/repository/central' }
        maven { url 'https://maven.aliyun.com/repository/jcenter' }
        maven { url 'https://maven.aliyun.com/repository/public' }
    }

    flatDir {
        dirs 'libs'
    }
}

dependencies {
    implementation project(":core")
    implementation project(":libGdx")
    implementation project(':libGdxAndroid')
    implementation 'androidx.appcompat:appcompat:1.3.0'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation project(":libGdxLib")
    implementation 'com.liulishuo.filedownloader:library:1.7.7'
}
