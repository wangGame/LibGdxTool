buildscript {
    repositories {
        maven {
            url 'https://maven.aliyun.com/repository/central'
            name 'central'
        }
        maven {
            url 'https://maven.aliyun.com/repository/jcenter'
            name 'jcenter'
        }
        maven {
            url 'https://maven.aliyun.com/repository/google'
            name 'Google'
        }
        mavenLocal()
        mavenCentral()
        gradlePluginPortal()
        maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
        google()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.6.1'
    }
}

allprojects {
    apply plugin: "idea"
    group = 'com.github.wanggame'
    version = '3.0.0'
    ext {
        appName = "LibGdxTool"
    }
    repositories {
        maven {
            url 'https://maven.aliyun.com/repository/central'
            name 'central'
        }
        maven {
            url 'https://maven.aliyun.com/repository/jcenter'
            name 'jcenter'
        }
        maven {
            url 'https://maven.aliyun.com/repository/google'
            name 'Google'
        }
        maven { url 'https://jitpack.io' }
        mavenLocal()
        mavenCentral()
        google()
        gradlePluginPortal()
        maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
        maven { url "https://oss.sonatype.org/content/repositories/releases/" }
    }
}

def githubPackagesOwner = 'wangGame'
def githubPackagesRepo = 'LibGdxTool'

tasks.register('syncReadmeVersion') {
    doLast {
        def readme = file("${rootDir}/README.md")
        if (!readme.exists()) {
            return
        }

        def markerPattern = /- 当前版本: `[^`]+` \[auto-sync\]/
        def currentText = readme.getText('UTF-8')
        def updatedText = currentText.replaceFirst(markerPattern, "- 当前版本: `${version}` [auto-sync]")

        if (currentText != updatedText) {
            readme.write(updatedText, 'UTF-8')
            println "README version synced to ${version}"
        }
    }
}

gradle.projectsEvaluated {
    allprojects {
        tasks.matching { it.name == 'publish' }.configureEach {
            dependsOn rootProject.tasks.named('syncReadmeVersion')
        }
    }
}

subprojects {
    // Publish Java modules as Maven artifacts.
    pluginManager.withPlugin('java') {
        apply plugin: 'maven-publish'

        java {
            withSourcesJar()
            withJavadocJar()
        }

        tasks.withType(Javadoc).configureEach {
            options.encoding = 'UTF-8'
            if (JavaVersion.current().isJava9Compatible()) {
                options.addBooleanOption('Xdoclint:none', true)
            }
        }

        publishing {
            publications {
                mavenJava(MavenPublication) {
                    from components.java
                    artifactId = project.name.toLowerCase()
                }
            }
            repositories {
                mavenLocal()
                maven {
                    name = 'GitHubPackages'
                    url = uri("https://maven.pkg.github.com/${githubPackagesOwner}/${githubPackagesRepo}")
                    credentials {
                        username = findProperty('gpr.user') ?: System.getenv('GITHUB_ACTOR')
                        password = findProperty('gpr.key') ?: System.getenv('GITHUB_TOKEN')
                    }
                }
            }
        }
    }

    // Publish Android library modules (AAR) from release variant.
    pluginManager.withPlugin('com.android.library') {
        apply plugin: 'maven-publish'

        android {
            publishing {
                singleVariant('release') {
                    withSourcesJar()
                }
            }
        }

        afterEvaluate {
            publishing {
                publications {
                    release(MavenPublication) {
                        from components.release
                        artifactId = project.name.toLowerCase()
                    }
                }
                repositories {
                    mavenLocal()
                    maven {
                        name = 'GitHubPackages'
                        url = uri("https://maven.pkg.github.com/${githubPackagesOwner}/${githubPackagesRepo}")
                        credentials {
                            username = findProperty('gpr.user') ?: System.getenv('GITHUB_ACTOR')
                            password = findProperty('gpr.key') ?: System.getenv('GITHUB_TOKEN')
                        }
                    }
                }
            }
        }
    }
}
